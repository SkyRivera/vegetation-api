# docker-compose.yml
version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: vegetation_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-vegetation_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-vegetation_password}
      POSTGRES_DB: ${DB_NAME:-vegetation_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-vegetation_user} -d ${DB_NAME:-vegetation_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vegetation_network
    restart: unless-stopped

  fastapi:
    build:
      context: .
      dockerfile: docker/Dockerfile.fastapi
    container_name: vegetation_fastapi
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-vegetation_db}
      - DB_USER=${DB_USER:-vegetation_user}
      - DB_PASSWORD=${DB_PASSWORD:-vegetation_password}
      - MODEL_PATH=/app/models/vegetation_classifier_latest.joblib
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./models:/app/models
      - ./app:/app/app  # Para desarrollo, remover en producción
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - vegetation_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    build:
      context: .
      dockerfile: docker/Dockerfile.nginx
    container_name: vegetation_nginx
    ports:
      - "80:80"
    depends_on:
      - fastapi
    networks:
      - vegetation_network
    restart: unless-stopped

networks:
  vegetation_network:
    driver: bridge

volumes:
  postgres_data: